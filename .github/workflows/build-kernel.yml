name: build-kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex gcc git libssl-dev libncurses-dev \
            lzop unzip zip cpio

      - name: 获取 arm-eabi-4.8 工具链（tarball 下载，master/main 分支都试）
        run: |
          mkdir -p toolchain/arm-eabi-4.8
          cd toolchain/arm-eabi-4.8
          for ref in master main; do
            for i in 1 2 3 4 5; do
              echo "尝试下载 arm-eabi-4.8@$ref (第 $i 次)"
              curl -fL --retry 3 --retry-all-errors --connect-timeout 20 \
                -o tc.tar.gz \
                "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8/+archive/refs/heads/$ref.tar.gz" \
                && tar -xzf tc.tar.gz && rm -f tc.tar.gz && break 2
              echo "下载失败，10 秒后重试..."
              sleep 10
            done
          done
          cd ../..
          test -x toolchain/arm-eabi-4.8/bin/arm-eabi-gcc

      - name: 配置内核（用 23 设备配置 msm8916_v23.config 做种子）
        run: |
          mkdir -p out
          cp arch/arm/configs/msm8916_v23.config out/.config
          make O=out ARCH=arm CROSS_COMPILE=$PWD/toolchain/arm-eabi-4.8/bin/arm-eabi- olddefconfig

      - name: 编译内核（-k 强制继续，一次暴露所有错误；日志落盘）
        run: |
          set -o pipefail
          make -j$(nproc) -k O=out ARCH=arm CROSS_COMPILE=$PWD/toolchain/arm-eabi-4.8/bin/arm-eabi- 2>&1 | tee out/build.log

      - name: 上传产物与日志（编译失败也上传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            out/arch/arm/boot/zImage
            out/arch/arm/boot/dts/qcom/
            out/build.log
          if-no-files-found: ignore
